{% extends 'manuels/base.html' %}

{% load bootstrap4 %}

{% block content %}
    <div class="row">
        <div class="col-12">
            <h1>Bienvenue {{ teacher.full_name }}</h1>
            <h2>{% block title %}Ajouter un livre{% endblock %}</h2>
            <form action="" method="post" class="form">
                {% csrf_token %}
                {% bootstrap_form form %}
                {% buttons %}
                    <button type="submit" class="btn btn-primary">Submit</button>
                {% endbuttons %}
            </form>
        </div>
    </div>
{% endblock %}
