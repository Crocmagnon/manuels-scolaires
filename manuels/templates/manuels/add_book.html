{% extends 'manuels/base.html' %}

{% load bootstrap4 %}

{% block title %}Ajouter un livre{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-12">
            Bienvenue {{ teacher.full_name }}
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <form action="#" method="post" class="form">
                {% csrf_token %}
                {% bootstrap_form form %}
                {% buttons %}
                    <button type="submit" class="btn btn-primary">Submit</button>
                {% endbuttons %}
            </form>
        </div>
    </div>
{% endblock %}
